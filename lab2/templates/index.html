<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Генератор билетов</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#677084; --accent:#2f6fed; --err:#c62828; --border:#d9dde5; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:520px; margin:48px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
    h1 { font-size:22px; margin:0 0 20px; }
    label { display:block; font-size:14px; color:var(--muted); margin:14px 0 6px; }
    select, button { width:100%; font-size:16px; padding:10px; border-radius:8px; border:1px solid var(--border); background:#fff; }
    button { margin-top:20px; background:var(--accent); color:#fff; border:none; cursor:pointer; }
    button:disabled { background:#aab4c8; cursor:not-allowed; }
    .error { display:none; margin-top:16px; padding:12px; border-radius:8px; background:#fdecea; color:var(--err); }
    .error button { width:auto; margin:10px 0 0; padding:6px 14px; background:var(--err); }
    .backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; padding:16px; }
    .backdrop.open { display:flex; }
    .modal { background:var(--card); border-radius:12px; padding:24px; max-width:560px; width:100%; }
    .modal h2 { margin:0 0 8px; }
    .modal .hint { color:var(--muted); font-size:13px; margin-top:16px; }
    .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; background:#fff3cd; color:#7a5b00; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Генератор экзаменационных билетов</h1>
    <label for="group">Группа</label>
    <select id="group"><option value="">— выберите группу —</option></select>
    <label for="student">Студент</label>
    <select id="student" disabled><option value="">— выберите студента —</option></select>
    <button id="generate" disabled>Сгенерировать билет</button>
    <div id="error" class="error" role="alert"><span id="error-text"></span><br><button id="retry" hidden>Повторить</button></div>
  </div>
</main>

<div id="result" class="backdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ticket-title">
    <h2 id="ticket-title"></h2>
    <span id="repeat-badge" class="badge" hidden>Повтор: билет из первой записи</span>
    <ol id="questions"></ol>
    <div class="hint">Нажмите ESC, чтобы вернуться к выбору.</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const group = $("group"), student = $("student"), generate = $("generate");
let students = [];

async function api(url, opts) {
  const r = await fetch(url, opts);
  const body = await r.json();
  if (!r.ok) throw Object.assign(new Error(body.error || "Ошибка"), body);
  return body;
}
function showError(e) {
  $("error-text").textContent = e.message;
  $("retry").hidden = !e.retry;
  $("error").style.display = "block";
}
function clearError() { $("error").style.display = "none"; }
function updateButton() { generate.disabled = !(group.value && student.value !== ""); }

async function loadGroups() {
  try {
    for (const g of await api("/api/groups")) group.add(new Option(g, g));
  } catch (e) { showError(e); }
}

group.addEventListener("change", async () => {
  clearError();
  student.length = 1; student.value = ""; students = [];
  student.disabled = true;
  updateButton();
  if (!group.value) return;
  try {
    students = await api("/api/students?group=" + encodeURIComponent(group.value));
    students.forEach((s, i) => student.add(new Option(s.full_name, i)));
    student.disabled = students.length === 0;
  } catch (e) { showError(e); }
});
student.addEventListener("change", updateButton);

async function doGenerate() {
  clearError();
  const s = students[+student.value];
  try {
    const t = await api("/api/tickets", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({group: group.value, last_name: s.last_name, first_name: s.first_name}),
    });
    $("ticket-title").textContent = "Ваш билет № " + t.number;
    $("repeat-badge").hidden = !t.is_repeat;
    $("questions").replaceChildren(...t.questions.map(q => Object.assign(document.createElement("li"), {textContent: q})));
    $("result").classList.add("open");
    $("result").setAttribute("aria-hidden", "false");
  } catch (e) { showError(e); }
}
generate.addEventListener("click", doGenerate);
$("retry").addEventListener("click", doGenerate);

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("result").classList.contains("open")) {
    $("result").classList.remove("open");
    $("result").setAttribute("aria-hidden", "true");
    generate.focus();
  }
});

loadGroups();
</script>
</body>
</html>
